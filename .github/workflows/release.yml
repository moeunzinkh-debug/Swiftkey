name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    name: Release
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    env:
      # គ្រប់ gradle invocation ត្រូវការ token នេះ ដើម្បីទាញ Morphe plugin ពី
      # GitHub Packages (MorpheApp/registry) តាម settings.gradle.kts
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # តេស្ដ back-merge មុនចេញ release — បើស្គ្រីបខូច កុំឲ្យមាន release ដែល
      # ចេញផ្សាយរួចតែមិនអាច back-merge ទៅ dev បាន
      - name: Test back-merge script
        run: bash .github/scripts/test-backmerge-main-to-dev.sh

      # ត្រួតពិនិត្យ marker របស់ README មុនពេល release — generate_patches_readme.py
      # ចេញ exit 1 បើ <!-- PATCHES_END --> បាត់ ហើយវានៅក្នុង prepareCmd របស់
      # semantic-release ដូច្នេះ release ទាំងមូលនឹងបរាជ័យ។ កំហុសនេះធ្លាប់កើតហើយ
      # (commit "Change Readme" លុប marker ចេញដោយដៃ) — ចាប់វានៅទីនេះជាមុនសិន។
      - name: Verify README patch markers
        run: |
          set -euo pipefail
          if ! grep -qE '<!-- PATCHES_START( EXPANDED)? -->' README.md; then
            echo "::error::README.md បាត់ <!-- PATCHES_START --> — សូមដាក់វាត្រឡប់មុនពេលចេញ release"
            exit 1
          fi
          if ! grep -qF '<!-- PATCHES_END -->' README.md; then
            echo "::error::README.md បាត់ <!-- PATCHES_END --> — សូមដាក់វាត្រឡប់មុនពេលចេញ release"
            exit 1
          fi
          echo "✅ README markers intact"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      # ១) build bundle .mpp មុនគេ — បើបំណះខូច ការងារនេះបរាជ័យត្រង់នេះ
      #    មុនពេល semantic-release កែ CHANGELOG/README/gradle.properties
      - name: Build .mpp bundle
        run: ./gradlew :patches:buildAndroid generatePatchesList

      # ២) ត្រួតពិនិត្យថា .mpp ចេញមែន — កុំឲ្យមាន release ដែលគ្មាន bundle
      - name: Verify .mpp bundle
        run: |
          set -euo pipefail
          echo "::notice::patches/build tree: $(find patches/build -maxdepth 2 2>/dev/null | tr '\n' ' ' | cut -c1-800)"
          # ឈ្មោះ bundle អាចមាន ឬមិនមានលេខកំណែ៖ `patches-<version>.mpp` នៅពេល
          # gradle.properties កំណត់ version (main/release) និង `patches.mpp` នៅពេល version
          # មិនបានកំណត់ (dev គ្មាន gradle.properties ដោយសារ back-merge រក្សាវាតាម branch)
          mapfile -t bundles < <(find patches/build -type f -name 'patches*.mpp' \
            ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' 2>/dev/null | sort)
          echo "::notice::.mpp bundles found: ${bundles[*]:-none}"
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::No .mpp bundle produced under patches/build"
            exit 1
          fi
          for bundle in "${bundles[@]}"; do
            size=$(stat -c %s "$bundle")
            echo "✅ Built bundle: $bundle ($size bytes)"
            echo "- \`$bundle\` — $size bytes" >> "$GITHUB_STEP_SUMMARY"
            # ត្រួតពិនិត្យខាងក្នុង bundle ពិតៗ៖ កូដដែល compile រួច (classes*.dex ពី buildAndroid)
            # និង extension .mpe (ពី extensions/) ត្រូវតែមាននៅក្នុង .mpp
            entries=$(unzip -Z1 "$bundle")
            dex=$(grep -cE '(^|/)classes[0-9]*\.dex$' <<<"$entries" || true)
            mpe=$(grep -cE '\.mpe$' <<<"$entries" || true)
            echo "::notice::${bundle}: $(wc -l <<<"$entries") entries, classes*.dex=${dex}, .mpe=${mpe}, ${size} bytes"
            echo "::notice::${bundle} contents: $(tr '\n' ' ' <<<"$entries" | cut -c1-600)"
            if (( dex == 0 )); then
              echo "::error::${bundle} has no classes*.dex — កូដបំណះដែល compile រួចមិនបានចូល bundle"
              exit 1
            fi
            if (( mpe == 0 )); then
              echo "::error::${bundle} has no .mpe — extensions/ មិនបានចូល bundle"
              exit 1
            fi
          done

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # ៣) លុប bundle ដែល build ខាងលើចេញ (វាយកលេខកំណែចាស់ពី gradle.properties)។
      #    semantic-release បន្ទាន់សម័យ gradle.properties មុន រួចដំណើរការ
      #    `./gradlew publish` → `publish.dependsOn(buildAndroid)` (Morphe plugin)
      #    ដូច្នេះ .mpp តែមួយគត់ដែលឡើងទៅ GitHub Release គឺ patches-<កំណែថ្មី>.mpp។
      #    បើមិនលុបទេ release ក្រោយៗ នឹងមាន .mpp ចាស់នៅជាប់ផង
      #    (glob ក្នុង .releaserc យក patches-*.mpp ទាំងអស់)។
      - name: Remove pre-release bundle
        run: |
          set -euo pipefail
          rm -fv patches/build/libs/patches*.mpp

      - name: Release
        uses: cycjimmy/semantic-release-action@v6
        id: release

      # ៤) រក bundle ត្រឹមត្រូវតាម tag ដែលបានចេញផ្សាយ (មិនមែន wildcard)
      #    ដើម្បីឲ្យ attestation និង artifact សំដៅលើឯកសារតែមួយគត់
      - name: Locate released .mpp bundle
        id: bundle
        if: steps.release.outputs.new_release_published == 'true'
        env:
          TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          bundle="patches/build/libs/patches-${version}.mpp"
          if [[ ! -f "$bundle" ]]; then
            # fallback: រកតាមឈ្មោះកំណែ គ្រប់ទីកន្លែងក្រោម patches/build។ បើនៅតែមិនឃើញ
            # យកបានតែ `patches.mpp` (ករណី version មិនបានកំណត់) — មិនយក bundle ដែលមាន
            # លេខកំណែខុសពី tag ទេ ព្រោះវាជាឯកសារចាស់។
            mapfile -t found < <(find patches/build -type f -name "patches-${version}.mpp" \
              ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' 2>/dev/null | sort)
            if (( ${#found[@]} == 0 )); then
              mapfile -t found < <(find patches/build -type f -name 'patches.mpp' 2>/dev/null | sort)
            fi
            echo "::notice::.mpp candidates for ${TAG}: ${found[*]:-none}"
            if (( ${#found[@]} != 1 )); then
              echo "::error::Released ${TAG} but ${bundle} is missing"
              echo "::notice::patches/build tree: $(find patches/build -maxdepth 3 2>/dev/null | tr '\n' ' ' | cut -c1-800)"
              exit 1
            fi
            bundle="${found[0]}"
          fi
          size=$(stat -c %s "$bundle")
          echo "path=${bundle}" >> "$GITHUB_OUTPUT"
          echo "✅ Released bundle: ${bundle} (${size} bytes)"

      - name: Attest
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Morphe Patches ${{ steps.release.outputs.new_release_git_tag }}'
          subject-path: ${{ steps.bundle.outputs.path }}

      - name: Upload .mpp bundle artifact
        if: steps.release.outputs.new_release_published == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: mpp-${{ steps.release.outputs.new_release_git_tag }}
          path: ${{ steps.bundle.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      # ៥) back-merge main → dev ដាក់ជា step ចុងក្រោយ (មិនមែនជា semantic-release plugin)
      #    ដូច្នេះបើវាបរាជ័យ ក៏ release + .mpp + attestation + artifact បានចេញរួចហើយដែរ។
      #    មុននេះវាជា plugin `success` របស់ semantic-release ដូច្នេះ conflict នៅ dev
      #    ធ្វើឲ្យ step "Release" បរាជ័យ ហើយ Attest/Upload .mpp ត្រូវរំលងទាំងស្រុង។
      #    Conflict លើឯកសារ release (CHANGELOG/README/gradle.properties/patches-*.json)
      #    ត្រូវបានដោះស្រាយដោយរក្សាទុកកំណែរបស់ dev។ ចំណែកឯកសារប្រភពដែល dev សរសេរ
      #    ឡើងវិញដោយចេតនា (ឧ. MicSupport.java) ត្រូវបានចុះបញ្ជី allow-list នៅក្នុង
      #    ស្គ្រីប — ក្រៅពីនោះស្គ្រីបឈប់ ហើយបញ្ចេញ ::error:: ឲ្យមនុស្សសម្រេចចិត្ត។
      - name: Back-merge main into dev
        id: backmerge
        if: steps.release.outputs.new_release_published == 'true' && github.ref_name == 'main'
        run: |
          set -euo pipefail
          # ដំណើរការពី clone ស្អាត មិនមែនពី worktree របស់ release ទេ៖ worktree នោះនៅ
          # សល់កាកសំណល់ npm/gradle/semantic-release ដែលអាចធ្វើឲ្យ `git switch` ទៅ dev
          # បដិសេធមិនដំណើរការ។ (run 35048531358 របស់ v1.6.0 បរាជ័យក្នុងរយៈពេល ~1 វិនាទី
          # ដោយមិនបានដល់ជំហាន merge ឡើយ។)
          origin_url="$(git remote get-url origin)"
          workdir="$(mktemp -d)"
          git clone --quiet "$origin_url" "$workdir/repo"
          cd "$workdir/repo"
          bash .github/scripts/backmerge-ci.sh

      # រាយការណ៍ស្ថានភាព dev ជា annotation — អាចអានបានតាម API ទោះបើ log ឆៅមិនអាចទាញបាន
      - name: Report dev state
        if: always() && steps.backmerge.conclusion != 'skipped'
        run: |
          set -uo pipefail
          git fetch --quiet origin main dev
          behind="$(git rev-list --count origin/dev..origin/main)"
          echo "::notice title=back-merge state::main=$(git rev-parse --short origin/main) dev=$(git rev-parse --short origin/dev) behind=${behind}"
          if git merge-base --is-ancestor origin/main origin/dev; then
            echo "✅ dev contains main."
          else
            echo "::error title=back-merge state::dev still does not contain main (${behind} commits behind)."
            exit 1
          fi
