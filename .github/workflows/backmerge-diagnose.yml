name: Diagnose back-merge (temporary)

# TEMPORARY diagnostic — delete after the silent back-merge failure is fixed.
# Replays the release workflow's back-merge step against the REAL main/dev pair
# with the push neutralized, so every pre-push stage is exercised in CI and any
# failure surfaces as an annotation (queryable via the check-runs API).
# Trigger: gh workflow run backmerge-diagnose.yml --ref <session-branch>

on:
  workflow_dispatch:
  # TEMPORARY trigger so the diagnosis runs autonomously: opening/updating the
  # session PR runs this. Remove together with the file once diagnosed.
  pull_request:

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Same as release.yml: needed to fetch the Morphe plugin from GitHub Packages.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout main (release worktree fidelity)
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # The hardened script lives on the session branch; extract it to /tmp so the
      # worktree itself stays pristine (an overlay in the tree would trip the script's
      # own dirty-worktree guard).
      - name: Overlay hardened back-merge script from session branch
        run: |
          set -euo pipefail
          git fetch origin arena/01a0a877-swiftkey
          git show FETCH_HEAD:.github/scripts/backmerge-main-to-dev.sh > /tmp/backmerge-diag.sh
          bash -n /tmp/backmerge-diag.sh
          echo "Hardened script staged at /tmp/backmerge-diag.sh; worktree untouched."

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      # Mirror the release workflow so build residue matches what the real back-merge
      # sees (this is suspect #1 for the silent `git switch` failure).
      - name: Build (mirror release residue)
        run: ./gradlew :patches:buildAndroid generatePatchesList --no-daemon

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # NEVER push during diagnosis: point the push URL at a dead local path. The script
      # is expected to fail here (exit 128, annotated) after proving every earlier stage.
      # An earlier/different failure annotation pinpoints the real bug instead.
      - name: Neutralize push (diagnose only, never push)
        run: |
          set -euo pipefail
          git remote set-url --push origin "$PWD/.push-neutralized"
          git remote -v

      - name: Run back-merge (push neutralized)
        run: bash /tmp/backmerge-diag.sh
