name: Build pull request

on:
  workflow_dispatch:
  pull_request:
    branches:
      # `main` ជា​សាខា​ចេញ​ផ្សាយ (release.yml ដំណើរការ​នៅ​ទីនោះ)។ បើ​មិន​ដាក់ `main` ទេ PR
      # ទៅ​ main មិន​ត្រូវ​បាន build សោះ​ទេ ហើយ​កំហុស compile ចេញ​រហូត​ដល់​ពេល merge
      # (ឃើញ​បាន​ពី PR #12/#13) —
      - dev
      - main

jobs:
  release:
    name: Build
    runs-on: ubuntu-latest
    env:
      # ត្រូវការសម្រាប់ទាញ Morphe plugin ពី GitHub Packages (MorpheApp/registry)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # សាកស្គ្រីប back-merge មុនអ្វីទាំងអស់ (រហ័ស មិនត្រូវការ Java/Node)។
      # ការធ្វើតេស្ដនេះហើយដែលប្រាប់ថា conflict ប្រភេទ modify/delete នៅ dev ត្រូវបានដោះស្រាយ។
      - name: Test back-merge script
        run: bash .github/scripts/test-backmerge-main-to-dev.sh

      # ត្រួតពិនិត្យ marker README នៅ PR ផង ដើម្បីឲ្យឃើញមុនពេល merge ទៅ main —
      # បើបាត់ generate_patches_readme.py នឹងធ្វើឲ្យ release បរាជ័យ (មើល release.yml)។
      - name: Verify README patch markers
        run: |
          set -euo pipefail
          if ! grep -qE '<!-- PATCHES_START( EXPANDED)? -->' README.md; then
            echo "::error::README.md បាត់ <!-- PATCHES_START -->"
            exit 1
          fi
          if ! grep -qF '<!-- PATCHES_END -->' README.md; then
            echo "::error::README.md បាត់ <!-- PATCHES_END -->"
            exit 1
          fi
          echo "✅ README markers intact"

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          # សមនឹង release.yml និង README (AGP 9 + compileSdk 36)
          java-version: '21'

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build .mpp bundle
        run: |
          set -o pipefail
          ./gradlew :patches:buildAndroid generatePatchesList --no-daemon 2>&1 | tee build-output.log || {
            echo "::error::Gradle build failed — មើល log ក្រោម (tail 150)"
            tail -150 build-output.log
            exit 1
          }

      # បើ build បរាជ័យ ផ្ញើ log tail ទៅ PR comment ដើម្បីងាយ debug (log Actions មិនងាយទាញយក)
      - name: Report build failure to PR
        if: failure() && github.event_name == 'pull_request'
        run: |
          if [ -f build-output.log ]; then
            tail -120 build-output.log > failure-tail.txt
          else
            echo "(no build log captured)" > failure-tail.txt
          fi
          python3 - "$GITHUB_TOKEN" "$GITHUB_REPOSITORY" "$GITHUB_EVENT_NUMBER" <<'PYEOF'
          import json, sys, urllib.request
          token, repo, number = sys.argv[1], sys.argv[2], sys.argv[3]
          body = open("failure-tail.txt", encoding="utf-8").read().strip()
          payload = json.dumps({
              "body": "🤖 CI build failed (auto-report from `build_pull_request.yml`):\n\n```\n"
                      + body[-9000:]
                      + "\n```"
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/issues/{number}/comments",
              data=payload,
              headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "User-Agent": "build-pr-ci",
              },
          )
          try:
              urllib.request.urlopen(req, timeout=30)
          except Exception as e:
              print(f"could not post PR comment: {e}")
          PYEOF

      # ត្រួតពិនិត្យថា bundle .mpp ចេញមែន ហើយបញ្ជូន path ពិតទៅ step ខាងក្រោម
      # (upload-artifact មិនស្គាល់ extglob ដូច !(*sources*) ទេ ដូច្នេះត្រូវដាក់ path ច្បាស់លាស់)
      - name: Verify .mpp bundle
        id: verify
        run: |
          set -euo pipefail
          echo "::notice::patches/build tree: $(find patches/build -maxdepth 2 2>/dev/null | tr '\n' ' ' | cut -c1-800)"
          # ឈ្មោះ bundle អាចមាន ឬមិនមានលេខកំណែ៖ `patches-<version>.mpp` នៅពេល
          # gradle.properties កំណត់ version (main/release) និង `patches.mpp` នៅពេល version
          # មិនបានកំណត់ (dev គ្មាន gradle.properties ដោយសារ back-merge រក្សាវាតាម branch)
          mapfile -t bundles < <(find patches/build -type f -name 'patches*.mpp' \
            ! -name '*-sources.mpp' ! -name '*-javadoc.mpp' 2>/dev/null | sort)
          echo "::notice::.mpp bundles found: ${bundles[*]:-none}"
          if (( ${#bundles[@]} == 0 )); then
            echo "::error::No .mpp bundle produced under patches/build"
            exit 1
          fi
          {
            echo "paths<<EOF"
            printf '%s\n' "${bundles[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          for bundle in "${bundles[@]}"; do
            size=$(stat -c %s "$bundle")
            echo "✅ Built bundle: $bundle ($size bytes)"
            echo "- \`$bundle\` — $size bytes" >> "$GITHUB_STEP_SUMMARY"
            # ត្រួតពិនិត្យខាងក្នុង bundle ពិតៗ៖ កូដដែល compile រួច (classes*.dex ពី buildAndroid)
            # និង extension .mpe (ពី extensions/) ត្រូវតែមាននៅក្នុង .mpp
            entries=$(unzip -Z1 "$bundle")
            dex=$(grep -cE '(^|/)classes[0-9]*\.dex$' <<<"$entries" || true)
            mpe=$(grep -cE '\.mpe$' <<<"$entries" || true)
            echo "::notice::${bundle}: $(wc -l <<<"$entries") entries, classes*.dex=${dex}, .mpe=${mpe}, ${size} bytes"
            echo "::notice::${bundle} contents: $(tr '\n' ' ' <<<"$entries" | cut -c1-600)"
            if (( dex == 0 )); then
              echo "::error::${bundle} has no classes*.dex — កូដបំណះដែល compile រួចមិនបានចូល bundle"
              exit 1
            fi
            if (( mpe == 0 )); then
              echo "::error::${bundle} has no .mpe — extensions/ មិនបានចូល bundle"
              exit 1
            fi
          done

      # ទុក bundle ឲ្យ reviewer ទាញយកទៅសាកក្នុង Morphe Manager បានភ្លាម
      - name: Upload .mpp bundle artifact
        uses: actions/upload-artifact@v7
        with:
          name: patches-bundle-${{ github.sha }}
          path: ${{ steps.verify.outputs.paths }}
          if-no-files-found: error
          retention-days: 14
